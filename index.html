<!DOCTYPE html>
<html lang="sq">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Promemori Abonimesh</title>
<meta http-equiv="Cache-Control" content="no-cache, must-revalidate">
<style>
:root{--bg:#f3f4f7;--card:#fff;--text:#1b1e23;--muted:#6b7280;--line:#e2e5ea;--accent:#2563eb;--red:#dc2626;--amber:#d97706;--green:#16a34a;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#0f1115;--card:#1a1d23;--text:#eceef2;--muted:#9aa3b2;--line:#2a2f39;--accent:#60a5fa;--red:#f87171;--amber:#fbbf24;--green:#4ade80;color-scheme:dark}}
*{box-sizing:border-box}
html{scroll-padding-top:70px}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.35 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
/* ---- menuja lart ---- */
.top{position:sticky;top:0;z-index:10;background:var(--card);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
.top-in{display:flex;align-items:center;gap:6px;padding:6px 10px;overflow-x:auto}
.brand{font-weight:800;margin-right:8px;white-space:nowrap}
.top a{padding:9px 14px;border-radius:10px;color:var(--muted);text-decoration:none;font-weight:600;white-space:nowrap}
.top a.on{background:var(--accent);color:#fff}
/* ---- faqja e gjerë ---- */
main{width:100%;max-width:1400px;margin:0 auto;padding:10px 10px calc(30px + env(safe-area-inset-bottom,0px))}
h1{font-size:20px;margin:6px 0 10px}h2{font-size:16px;margin:18px 0 8px}
.view{display:none}.view.on{display:block}
input,select,textarea{width:100%;padding:11px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--text);font:inherit;min-height:44px}
textarea{resize:vertical}
input[type=checkbox]{width:auto;min-height:0;margin-right:8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:12px}
button,a.btn{display:inline-block;padding:10px 14px;min-height:42px;border:0;border-radius:10px;background:var(--accent);color:#fff;font:inherit;font-weight:600;text-decoration:none;cursor:pointer;text-align:center}
button.ghost,a.ghost{background:transparent;color:var(--accent);border:1px solid var(--line);font-size:14px}
button.del{background:transparent;color:var(--red);border:1px solid var(--line);font-size:14px}
button:disabled{opacity:.45;cursor:default}
.meta{color:var(--muted);font-size:13px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px}
.f{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}
.f.wide{grid-column:1/-1}
/* ---- filtrat ---- */
.chips{display:flex;gap:6px;margin-bottom:8px}
.chip{flex:1;background:var(--card);color:var(--text);border:1px solid var(--line);font-size:14px}
.chip.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.tools{display:grid;grid-template-columns:2fr 1fr 1fr;gap:8px;margin-bottom:10px}
/* ---- lista ---- */
.list{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.lhead{display:none}
.item{border-bottom:1px solid var(--line)}.item:last-child{border-bottom:0}
.head{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:10px 12px;cursor:pointer;align-items:center}
.nm{font-weight:700}.sub{color:var(--muted);font-size:13px}
.c-start,.c-panel,.c-app,.c-mac{display:none}
.c-mac{font-family:ui-monospace,Menlo,monospace}
.c-date{text-align:right;font-size:13px;white-space:nowrap}
.c-state{grid-column:2;text-align:right;font-weight:700;font-size:13px;white-space:nowrap}
.item.open{background:color-mix(in srgb,var(--accent) 6%,var(--card))}
.edit{display:none}
.btns{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.empty{color:var(--muted);text-align:center;padding:22px}
.row{display:flex;gap:8px;align-items:center;padding:6px 0}
.row input{flex:1}
@media (min-width:760px){
  .head,.lhead{display:grid;grid-template-columns:1.8fr .9fr 1.1fr .8fr 1fr 1fr 1.5fr 46px;gap:0}
  .head>div,.lhead>span{padding:0 8px;border-left:1px solid var(--line);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .head>div:first-child,.lhead>span:first-child{border-left:0;padding-left:0}
  .sub{display:none}.c-start,.c-panel,.c-app,.c-mac{display:block;font-size:14px}
  .c-date{text-align:left;font-size:14px}.c-state{grid-column:auto;text-align:left}
  .lhead{padding:8px 12px;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;border-bottom:1px solid var(--line)}
}
.lay.has #side{display:block;margin-bottom:12px}
.nbin{display:none}
.sbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.sh{font-size:26px;font-weight:800;line-height:1.15}
.sc{border:1px solid var(--line);border-radius:14px;padding:18px 20px;margin-bottom:14px;background:var(--card);cursor:pointer}
.sc.cur{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent)}
.sct{display:flex;align-items:center;flex-wrap:wrap;gap:6px 10px;margin-bottom:10px;font-size:19px}
.big{margin-left:auto;font-weight:800;font-size:24px}
.bd{font-size:12px;font-weight:700;color:var(--accent);border:1px solid var(--accent);border-radius:6px;padding:2px 8px}
.sr{display:flex;justify-content:space-between;gap:12px;font-size:16px;padding:7px 0;border-top:1px dashed var(--line)}
.sr span:first-child{color:var(--muted)}.sr span:last-child{text-align:right;word-break:break-all;font-weight:600}
.sedit{margin-top:14px;padding:14px;border:1px solid var(--line);border-radius:14px;background:var(--card)}
@media (min-width:1000px){
  .lay.has{display:grid;grid-template-columns:430px minmax(0,1fr);gap:16px;align-items:start}
  .lay.has #side{position:sticky;top:70px;max-height:calc(100vh - 84px);overflow:auto;margin-bottom:0}
}
@media (max-width:520px){.tools{grid-template-columns:1fr 1fr}.tools #q{grid-column:1/-1}}
/* ---- PA PAGUAR ---- */
.pay{--c:var(--red);display:inline-block;margin-left:8px;padding:1px 8px;border-radius:6px;color:var(--c);background:color-mix(in srgb,var(--c) 10%,transparent);font-size:11px;font-weight:700;vertical-align:middle;white-space:nowrap;flex:none}
.pay.nw{--c:var(--accent)}
/* rreshta si xham: New / Pa paguar / Falas */
.list{background:var(--card)}
.item.unpaid,.item.falas,.item.isnew{--t:var(--accent);border-left:3px solid var(--t);background:color-mix(in srgb,var(--t) 6%,transparent)}
.item.isnew{--t:var(--accent)}.item.falas{--t:var(--green)}.item.unpaid{--t:var(--red)}
.payzone{margin-top:36px;padding-top:16px;border-top:1px dashed var(--line)}
.payzone .ptitle{font-weight:700;margin-bottom:10px}
.pay.fal{--c:var(--green)}
.payopts{display:flex;gap:8px;flex-wrap:wrap}
.payopts button{flex:1 1 45%;background:transparent;color:var(--text);border:2px solid var(--line);font-size:14px}
.payopts button.on.up{background:color-mix(in srgb,var(--red) 16%,transparent);border-color:var(--red);color:var(--red)}
.payopts button.on.fa{background:color-mix(in srgb,var(--green) 16%,transparent);border-color:var(--green);color:var(--green)}
.payopts button.on.pd{background:var(--accent);border-color:var(--accent);color:#fff}
button.paybtn{background:var(--red);color:#fff}
button.paybtn.ok{background:var(--green)}
.sub,.lnk{display:none}
/* ---- telefoni: kartë e qartë për çdo abonent ---- */
@media (max-width:759px){
  .head{grid-template-columns:1fr auto auto;grid-template-areas:"name state del" "panel date date" "sub sub sub" "lnk lnk lnk";gap:6px 10px;padding:12px 14px}
  .head .c-name{grid-area:name;min-width:0}
  .head .nm{font-size:17px;line-height:1.25;overflow-wrap:anywhere}
  .head .c-state{grid-area:state;grid-column:auto;align-self:start;padding:3px 10px;border-radius:999px;background:color-mix(in srgb,currentColor 14%,transparent);font-size:12px}
  .head .c-panel{grid-area:panel;display:block;justify-self:start;padding:2px 10px;border-radius:8px;border:1px solid var(--line);font-size:12px;font-weight:700;color:var(--muted)}
  .head .c-panel:empty{display:none}
  .head .c-date{grid-area:date;align-self:center;color:var(--muted)}
  .head .sub{grid-area:sub;display:block;font-size:13px;overflow-wrap:anywhere}
  .head .sub:empty{display:none}
  .head .lnk{grid-area:lnk;display:block;font-size:12px;padding:6px 10px;border-radius:8px;background:var(--bg);color:var(--muted)}
  .head .lnk:empty{display:none}
  .chips{flex-wrap:wrap}.chip{flex:1 1 30%;padding:9px 6px;font-size:13px}
  .sc{padding:14px 16px}.sh{font-size:22px}.big{font-size:20px}.sct{font-size:17px}.sr{font-size:15px}
  .sedit .grid{grid-template-columns:1fr}
  .sbar button{flex:1 1 30%}
  .btns button,.btns a.btn{flex:1 1 45%}
  main{padding:8px 8px calc(30px + env(safe-area-inset-bottom,0px))}
}
/* telefon/tablet: kur hapet një abonent, shfaqet vetëm ai (me «← Mbrapa») */
@media (max-width:999px){.lay.has .lmain{display:none}}

/* ---- FREE: shkrim blu + aura blu ---- */
:root{--blue:#2563eb}
@media (prefers-color-scheme:dark){:root{--blue:#60a5fa}}
#side{padding:8px}
.nm{display:flex;align-items:center;min-width:0}
.nm .nt{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.item.isfree .nt{color:var(--blue)}
.item.open.isfree{background:color-mix(in srgb,var(--blue) 8%,var(--card))}
.sc.free{border-color:var(--blue);box-shadow:0 0 0 2px var(--blue),0 0 28px 4px color-mix(in srgb,var(--blue) 45%,transparent)}
.sc.free .sct b{color:var(--blue)}
/* ---- butoni Fshi në rresht ---- */
.rdel{flex:none;margin-left:8px;min-height:0;padding:1px 8px;font-size:13px;line-height:1.4;background:transparent;color:var(--red);border:1px solid color-mix(in srgb,var(--red) 40%,transparent);border-radius:8px}
/* ---- zgjedhja e kohëzgjatjes me klik ---- */
.seg{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.seg button{min-height:54px;padding:6px;font-size:17px;background:transparent;color:var(--text);border:2px solid var(--line)}
.seg button.on{background:var(--accent);border-color:var(--accent);color:#fff}
/* ---- abonimi i hapur: më i madh ---- */
.sh{font-size:32px}.sc{padding:22px 24px}.sct{font-size:22px}.big{font-size:32px}.sr{font-size:19px;padding:10px 0}
.sbar button{min-height:50px;font-size:17px}
.sedit{padding:18px;font-size:17px}.sedit .f{font-size:15px}
.sedit input,.sedit select,.sedit textarea{min-height:52px;font-size:17px}
.sedit .btns button,.sedit .btns a.btn{min-height:50px;font-size:16px}
.payopts button{min-height:52px;font-size:16px}
@media (max-width:759px){
  .sh{font-size:27px}.sc{padding:18px}.big{font-size:26px}.sr{font-size:17px}
  .nm{flex-wrap:wrap}.head .nm .nt{white-space:normal;overflow-wrap:anywhere}
  .seg button{font-size:15px}
}

/* ---- ikona e fshirjes (kolona e fundit) ---- */
.c-del{display:flex;justify-content:center}
.head .c-del{grid-area:del;padding:0}
.rdel{margin:0;padding:2px 6px;font-size:18px;line-height:1;min-height:0;background:transparent;border:0;color:var(--text);opacity:.45;border-radius:8px}
.rdel:hover,.rdel:active{opacity:1;background:color-mix(in srgb,var(--red) 15%,transparent)}
@media (min-width:760px){.head>.c-del{border-left:0}}
/* ---- paneli i abonentit: PC gjysma e ekranit, telefon i plotë ---- */
@media (min-width:1000px){
  .lay.has{grid-template-columns:minmax(0,1fr) minmax(0,1fr)!important}
  .sh{font-size:40px}.sct{font-size:26px}.big{font-size:40px}.sr{font-size:22px;padding:14px 0}.sc{padding:28px 32px}
  .sbar button{min-height:56px;font-size:18px}
}
@media (max-width:999px){
  .sh{font-size:32px}.big{font-size:36px}.sct{font-size:24px}.sr{font-size:21px;padding:14px 0}.sc{padding:22px}
  .sc.solo{min-height:calc(100vh - 330px);display:flex;flex-direction:column;justify-content:space-evenly}
  .sbar button{min-height:56px;font-size:18px}
}

/* ---- alarmi: abonime që skadojnë brenda 7 ditëve ---- */
#alertbox{position:fixed;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:50;display:none;font-family:inherit}
#alertbox .ap{width:min(360px,calc(100vw - 24px));max-height:min(70vh,520px);display:flex;flex-direction:column;background:var(--card);color:var(--text);border:2px solid var(--amber);border-radius:14px;box-shadow:0 10px 30px rgba(0,0,0,.28);overflow:hidden}
#alertbox .ah{display:flex;align-items:center;gap:6px;padding:8px 8px 8px 12px;background:var(--amber);color:#000;font-weight:800}
#alertbox .ah span{flex:1}
#alertbox .ah button{min-height:0;width:32px;height:32px;padding:0;border-radius:8px;background:rgba(0,0,0,.14);color:#000;font-size:18px;line-height:1}
#alertbox .al{overflow:auto;padding:4px 12px}
#alertbox .ar{display:flex;gap:8px;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
#alertbox .ar:last-child{border-bottom:0}
#alertbox .ar b{word-break:break-word}
#alertbox .ar i{font-style:normal;font-weight:700;white-space:nowrap}
#alertbox .af{padding:8px 12px;border-top:1px solid var(--line)}
#alertbox .af button{width:100%}
#alertbox .ab{display:none;position:relative;width:60px;height:60px;min-height:0;padding:0;border-radius:50%;background:var(--amber);color:#000;font-size:26px;box-shadow:0 6px 18px rgba(0,0,0,.35)}
#alertbox .ab em{position:absolute;top:-4px;right:-4px;min-width:24px;height:24px;padding:0 5px;border-radius:12px;background:var(--red);color:#fff;font:700 13px/24px system-ui;font-style:normal}
#alertbox.min .ap{display:none}#alertbox.min .ab{display:block}

/* ---- Lion = portokalli, Mega = vjollcë ---- */
:root{--lion:#ea580c;--mega:#7c3aed}
@media (prefers-color-scheme:dark){:root{--lion:#fb923c;--mega:#a78bfa}}
[data-p="lion"]{--pc:var(--lion)}[data-p="mega"]{--pc:var(--mega)}
.item[data-p]{border-left:6px solid var(--pc)}
.item[data-p] .head .c-panel{display:block;justify-self:start;padding:2px 12px;border-radius:999px;border:0;background:var(--pc);color:#fff;font-size:13px;font-weight:800;letter-spacing:.04em;text-transform:uppercase}
.item[data-p] .head .c-panel:empty{display:none}
.sc[data-p]{border-left:10px solid var(--pc)}
.sc[data-p] .sct b{background:var(--pc);color:#fff!important;padding:3px 14px;border-radius:999px;font-size:.9em;letter-spacing:.05em;text-transform:uppercase}
.sc[data-p].cur{background:color-mix(in srgb,var(--pc) 9%,var(--card))}
.sc .hint{margin-top:10px;text-align:center;font-size:13px}
.sc .sedit{margin-top:14px;cursor:default;box-shadow:none}

/* ---- butoni «Të lira»: xham blu, pulson lehtë, slide me abonimet ---- */
.chip.freechip{position:relative;overflow:hidden;color:#fff;border:1px solid rgba(255,255,255,.5);
  background:linear-gradient(135deg,color-mix(in srgb,var(--blue) 82%,#fff 18%),color-mix(in srgb,var(--blue) 60%,transparent));
  -webkit-backdrop-filter:blur(12px) saturate(170%);backdrop-filter:blur(12px) saturate(170%);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.65),inset 0 -8px 16px rgba(255,255,255,.08),0 4px 16px color-mix(in srgb,var(--blue) 35%,transparent);
  text-shadow:0 1px 2px rgba(0,0,0,.25)}
.chip.freechip::after{content:"";position:absolute;left:0;right:0;top:0;height:48%;pointer-events:none;border-radius:inherit;
  background:linear-gradient(180deg,rgba(255,255,255,.38),rgba(255,255,255,0))}
.chip.freechip.has{animation:freepulse 2.8s ease-in-out infinite}
.chip.freechip.on{border-color:#fff;box-shadow:inset 0 1px 0 rgba(255,255,255,.7),0 0 0 2px color-mix(in srgb,var(--blue) 70%,#fff),0 6px 22px color-mix(in srgb,var(--blue) 55%,transparent)}
@keyframes freepulse{
  0%,100%{box-shadow:inset 0 1px 0 rgba(255,255,255,.65),0 4px 14px color-mix(in srgb,var(--blue) 30%,transparent),0 0 0 0 color-mix(in srgb,var(--blue) 45%,transparent)}
  50%{box-shadow:inset 0 1px 0 rgba(255,255,255,.65),0 4px 22px color-mix(in srgb,var(--blue) 55%,transparent),0 0 0 7px color-mix(in srgb,var(--blue) 0%,transparent)}
}
.freechip .cl,.freechip .ct{display:block;position:relative;z-index:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:transform .45s ease,opacity .45s ease}
.freechip .ct{position:absolute;left:10px;right:10px;top:0;bottom:0;display:flex;align-items:center;justify-content:center;white-space:pre-line;overflow:visible;text-overflow:clip;line-height:1.2;font-size:15px;font-weight:800;text-align:center;transform:translateY(160%);opacity:0}
.chips{flex-wrap:wrap}
.chip.freechip{flex:1 1 100%;order:-1;min-height:64px;font-size:16px}
.expgrp{padding:12px;background:var(--bg);color:var(--muted);font-weight:700;cursor:pointer;border-top:1px solid var(--line);border-bottom:1px solid var(--line);user-select:none}
.head>.c-state,.head>.c-date{white-space:normal;overflow:visible;text-overflow:clip;overflow-wrap:anywhere}
.freechip.tick .cl{transform:translateY(-160%);opacity:0}
.freechip .ct.run{animation:ftrun 2.6s ease both}
@keyframes ftrun{0%{transform:translateY(160%);opacity:0}16%,84%{transform:translateY(0);opacity:1}100%{transform:translateY(-160%);opacity:0}}
@media (prefers-reduced-motion:reduce){.chip.freechip.has{animation:none}}

/* =====================================================================
   PAMJE E LehtË & E PASTËR (si programi i inventarit) — vetëm stil, pa ndryshuar funksionet
   ===================================================================== */
:root,:root:not([data-theme="light"]){
  --bg:#f7f8fa;--card:#fff;--text:#1f2937;--muted:#6b7280;--line:#e5e7eb;
  --accent:#3b6fe0;--blue:#3b6fe0;--red:#d9534f;--amber:#d98a1f;--green:#2f9e63;
  --lion:#e0803a;--mega:#8b6fd6;--soft:#eef3ff;--soft-line:#cfdcfb;color-scheme:light}
@media (prefers-color-scheme:dark){
  :root,:root:not([data-theme="light"]){
    --bg:#f7f8fa;--card:#fff;--text:#1f2937;--muted:#6b7280;--line:#e5e7eb;
    --accent:#3b6fe0;--blue:#3b6fe0;--red:#d9534f;--amber:#d98a1f;--green:#2f9e63;
    --lion:#e0803a;--mega:#8b6fd6;color-scheme:light}}

body{font-size:14px;line-height:1.4;font-family:"Segoe UI",system-ui,-apple-system,Roboto,Inter,sans-serif}
main{max-width:1200px;padding-top:16px}
h1{font-size:20px;font-weight:700;margin:4px 0 14px}
h2{font-size:15px;font-weight:700}

/* menuja lart */
.top{background:rgba(255,255,255,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.top-in{gap:8px;padding:8px 14px;max-width:1200px;margin:0 auto}
.brand{font-weight:700;font-size:15px}
.top a{padding:6px 14px;border:1px solid var(--line);background:#fff;border-radius:8px;font-weight:500;font-size:14px;color:var(--text)}
.top a.on{background:var(--soft);color:var(--accent);border-color:var(--soft-line)}

/* butonat: të bardhë me kontur të hollë */
button,a.btn{min-height:36px;padding:7px 14px;border-radius:8px;background:#fff;color:var(--text);border:1px solid var(--line);font-weight:500;font-size:14px;transition:background .15s,border-color .15s}
button:hover,a.btn:hover{background:#f3f4f6}
button.ghost,a.ghost{background:#fff;color:var(--text)}
button.del,.rdel{background:#fff;color:var(--red);border-color:#f3d0ce}
#add,#imp,#addp,#pinbtn,#alertgo{background:var(--soft);color:var(--accent);border-color:var(--soft-line);font-weight:600}
#add:hover,#imp:hover,#addp:hover,#pinbtn:hover,#alertgo:hover{background:#e3ebff}
button.paybtn{background:#fdeeed;color:var(--red);border-color:#f3d0ce}
button.paybtn.ok{background:#e8f6ee;color:var(--green);border-color:#c5e8d3}

/* fusha */
input,select,textarea{background:#fff;border:1px solid var(--line);border-radius:8px;min-height:38px;padding:8px 10px;font-size:14px}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--soft-line);box-shadow:0 0 0 3px rgba(59,111,224,.12)}
.f{font-size:12px;font-weight:500}

/* karta */
.card,.list,.sc,.sedit{border:1px solid var(--line);border-radius:12px;background:#fff;box-shadow:none}
.card{padding:14px 16px}

/* filtrat */
.chips{gap:8px;margin-bottom:10px}
.chip{border-radius:10px;min-height:40px;font-weight:600;background:#fff;color:var(--text)}
.chip.on{background:var(--soft);color:var(--accent);border-color:var(--soft-line)}
.chip.freechip{background:#f1f7ff;color:var(--accent);border:1px solid var(--soft-line);box-shadow:none;text-shadow:none;
  -webkit-backdrop-filter:none;backdrop-filter:none;animation:none!important;min-height:44px;font-size:14px}
.chip.freechip::after{display:none}
